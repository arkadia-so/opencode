name: check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, beta]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      cache:
        description: outrun's cache namespace (ARK-81 bench; a fresh one is a cold cache)
        type: string
        default: outrun

concurrency:
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

env:
  OUTRUN_CACHE_URL: https://turbo-cache.arkadia.so
  OUTRUN_CACHE_TEAM: ${{ inputs.cache || 'outrun' }}

jobs:
  check:
    name: typecheck
    if: ${{ !github.event.pull_request.draft }}
    runs-on: outrun-linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # A pull request checks out its merge into the current base; the first parent is that base.
          fetch-depth: 2

      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      # outrun (ARK-81): lint and typecheck are one command unit; a recorded pass of the same inputs skips them.
      - name: Setup Bun (no install)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Plan
        id: plan
        run: .github/outrun/run plan --out "$RUNNER_TEMP/plan.json"

      - name: Setup Bun
        if: steps.plan.outputs.run-typecheck == 'true' || github.event_name == 'pull_request'
        uses: ./.github/actions/setup-bun

      - name: Lint
        if: steps.plan.outputs.run-typecheck == 'true'
        run: bun run lint

      # Local `bun run check` uses `bun check`; CI keeps the official TypeScript compiler as the source of truth.
      - name: Typecheck (TypeScript 7.1)
        if: steps.plan.outputs.run-typecheck == 'true'
        run: bun run typecheck:tsc

      - name: Record typecheck
        if: steps.plan.outputs.run-typecheck == 'true'
        run: .github/outrun/run record typecheck --key "${{ fromJSON(steps.plan.outputs.keys).typecheck }}" --since ${{ steps.start.outputs.at }}

      # Every GUI package file (app, desktop, gui-plugins, the plugin package's GUI SDK, ui, session-ui) a pull request adds or edits must be free of
      # oxlint problems, warn-level rules (anti-slop) included. Other packages are not affected.
      - name: Lint changed files
        if: github.event_name == 'pull_request'
        # Against the merge's first parent, so base-branch commits the pull request has not merged are not counted as its
        # changes (the event's base SHA can predate them).
        run: bun run lint:changed HEAD^1
