name: check-test

on:
  push:
    branches:
      - dev
      - beta
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      cache:
        description: outrun's cache namespace (ARK-81 bench; a fresh one is a cold cache)
        type: string
        default: outrun
      quarantine:
        description: Run only the quarantined browser tests (packages/app/e2e/QUARANTINE.md)
        type: boolean
        default: false

concurrency:
  # A new push to a pull request cancels its stale run. Every push and manual run keeps its own group, so each
  # dev and beta commit gets a verdict and a quarantine run never cancels a normal one.
  group: ${{ case(github.event_name == 'pull_request', format('{0}-{1}', github.workflow, github.event.pull_request.number), format('{0}-{1}', github.workflow, github.run_id)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTRUN_CACHE_URL: https://cache.outrun.sh
  OUTRUN_CACHE_TEAM: ${{ inputs.cache || 'outrun' }}
  # Set for the unit tests upstream; workflow-wide here so the plan job keys units with the same value.
  OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "false"

jobs:
  # outrun (ARK-81): every test file is looked up once here, and the test shards start only for what missed. The
  # checks, the build and the browser suites start beside it and each looks its own command up.
  plan:
    name: plan
    if: ${{ !github.event.pull_request.draft }}
    runs-on: outrun-linux-arm64
    outputs:
      runners: ${{ steps.plan.outputs.runners }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Plan
        id: plan
        run: .github/outrun/run plan --out plan.json --max-runners 3 --target 150 --start 60 --slots 4

      - name: Upload the plan
        if: steps.plan.outputs.runners != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outrun-plan
          path: plan.json
          retention-days: 1

  unit:
    name: unit (${{ matrix.shard }}/${{ needs.plan.outputs.runners }})
    needs: plan
    if: needs.plan.outputs.runners != '0'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: outrun-linux-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Install ripgrep (ARK-81 bench, every variant, the tests need rg on PATH)
        run: |
          case "$(uname -m)" in x86_64) t=x86_64-unknown-linux-musl ;; *) t=aarch64-unknown-linux-gnu ;; esac
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-$t.tar.gz" | sudo tar -xz -C /usr/local/bin --strip-components=1 "ripgrep-15.1.0-$t/rg"

      - name: Download the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: outrun-plan

      - name: Run unit tests
        timeout-minutes: 20
        run: .github/outrun/run test --plan plan.json --shard ${{ matrix.shard }}/${{ needs.plan.outputs.runners }} --summary summary.json

  checks:
    name: unit checks (${{ matrix.id }})
    strategy:
      fail-fast: false
      max-parallel: 2 # ARK-81: about 8 Linux VMs per run at most
      matrix:
        id: [effect-rules, codemode-pack, sdk-package, client-generated, protocol-generated]
    runs-on: outrun-linux-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # outrun (ARK-81): this job starts beside the plan and looks its own command up; a recorded pass skips every step.
      - name: Setup Bun (no install)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Look checks:${{ matrix.id }} up
        id: look
        run: .github/outrun/run lookup "checks:${{ matrix.id }}"

      - name: Setup Bun
        if: steps.look.outputs.run == 'true'
        uses: ./.github/actions/setup-bun

      - name: Effect simplification rules
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'effect-rules') }}
        run: |
          bun run test:effect-simplification-rules
          bun run lint:effect-simplifications

      - name: Verify packed codemode package
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'codemode-pack') }}
        working-directory: packages/codemode
        run: bun run pack

      - name: Verify packed workerd SDK
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'sdk-package') }}
        timeout-minutes: 15
        run: bun turbo verify:package --filter=@opencode/sdk

      - name: Check generated client
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'client-generated') }}
        working-directory: packages/client
        run: bun run check:generated

      - name: Check generated OpenAPI document
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'protocol-generated') }}
        working-directory: packages/protocol
        run: bun run check:generated

      - name: Record checks:${{ matrix.id }}
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record "checks:${{ matrix.id }}" --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  build:
    name: build (linux)
    runs-on: outrun-linux-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # outrun (ARK-81): this job starts beside the plan and looks its own command up; a recorded pass skips every step.
      - name: Setup Bun (no install)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Look build up
        id: look
        run: .github/outrun/run lookup "build"

      - name: Setup Bun
        if: steps.look.outputs.run == 'true'
        uses: ./.github/actions/setup-bun

      - name: Verify compiled service lifecycle
        if: steps.look.outputs.run == 'true'
        timeout-minutes: 10
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build.ts --single --skip-install
          bun run script/service-smoke.ts

      # Unit tests import workspace sources and never build the libraries they use, so this checks those builds. The
      # CLI and app closures hold every library a tested package depends on. The builds are tsc and Bun.build with no
      # platform-specific steps, and the libraries publish from Linux, so Windows skips them.
      - name: Build workspace libraries
        if: ${{ steps.look.outputs.run == 'true' && (!cancelled() && runner.os == 'Linux') }}
        timeout-minutes: 10
        run: |
          bun turbo build --concurrency=3 --filter='@opencode/cli^...' --filter='@opencode/app^...'
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Setup Node build runtime
        if: ${{ steps.look.outputs.run == 'true' && (!cancelled()) }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Verify Node build
        if: ${{ steps.look.outputs.run == 'true' && (!cancelled()) }}
        timeout-minutes: 15
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build-node.ts --single --skip-install --outdir=dist/node
          bun run script/service-smoke.ts --node

      - name: Record build
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record "build" --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  e2e-suite:
    name: e2e (linux, ${{ matrix.id }})
    strategy:
      fail-fast: false
      max-parallel: 3 # ARK-81: about 8 Linux VMs per run at most
      matrix:
        id: [app-1, app-2, session-ui-components, app-components]
    runs-on: outrun-linux-arm64
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # outrun (ARK-81): this job starts beside the plan and looks its own command up; a recorded pass skips every step.
      - name: Setup Bun (no install)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Look e2e:${{ matrix.id }} up
        id: look
        run: .github/outrun/run lookup "e2e:${{ matrix.id }}"

      - name: Setup Node
        if: steps.look.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        if: steps.look.outputs.run == 'true'
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        if: steps.look.outputs.run == 'true'
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.look.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: ${{ steps.look.outputs.run == 'true' && (runner.os == 'Linux') }}
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: ${{ steps.look.outputs.run == 'true' && (steps.playwright-cache.outputs.cache-hit != 'true') }}
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests against production build
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'app-1' || matrix.id == 'app-2') }}
        run: bun --cwd packages/app test:e2e:built --shard=${{ matrix.id == 'app-1' && '1/2' || '2/2' }}
        env:
          CI: true
        timeout-minutes: 15

      - name: Verify service worker precaching and upgrades
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'app-2') }}
        working-directory: packages/app
        run: bunx playwright test --config e2e/service-worker/playwright.config.ts
        timeout-minutes: 5

      - name: Run session UI component tests
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'session-ui-components') }}
        run: bun --cwd packages/session-ui test:components
        env:
          CI: true
        timeout-minutes: 15

      - name: Run app component tests
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'app-components') }}
        run: bun --cwd packages/app test:components
        env:
          CI: true
        timeout-minutes: 15

      - name: Record e2e:${{ matrix.id }}
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record "e2e:${{ matrix.id }}" --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  e2e:
    name: e2e (linux)
    needs: [e2e-suite]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: outrun-linux-arm64
    steps:
      - name: Check browser test results
        env:
          SUITES: ${{ needs.e2e-suite.result }}
        run: |
          echo "browser test legs: $SUITES"
          test "$SUITES" = success
