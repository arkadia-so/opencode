name: cache-probe
on:
  push:
    branches: [bench/probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: outrun-linux-arm64
    steps:
      - name: What the machine keeps between jobs (ARK-81)
        run: |
          set +e
          echo "home=$HOME user=$(id -un)"; df -h / "$HOME" | tail -2
          for d in ~/.bun/install/cache ~/.cache ~/.npm /opt/hostedtoolcache ~/.cache/ms-playwright; do printf '%s ' "$d"; du -sh "$d" 2>/dev/null | cut -f1 || echo absent; echo; done
          ls /opt/hostedtoolcache 2>/dev/null
          env | grep -i outrun | sed 's/=.*TOKEN.*/=***/' | cut -c1-120
          which bun node; bun --version 2>/dev/null; nproc; free -g | head -2
